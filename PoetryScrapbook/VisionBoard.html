<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vision Board - Creative Space</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #f5f7f6;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  color: #2d3436;
  overflow: hidden;
  height: 100vh;
}

/* Minimal Toolbar */
.toolbar {
  position: fixed;
  top: 20px;
  left: 20px;
  background: white;
  padding: 8px;
  display: flex;
  gap: 6px;
  border-radius: 12px;
  box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
  z-index: 3000;
  transition: all 0.3s ease;
}

.toolbar:hover {
  box-shadow: 0 4px 30px rgba(43, 221, 39, 0.15);
}

.tool-btn {
  min-width: 70px;
  height: 38px;
  background: transparent;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 12px;
  color: #2d3436;
}

.tool-btn:hover {
  background: #f0f9f4;
  transform: translateY(-2px);
}

.tool-btn.active {
  background: linear-gradient(135deg, #2bdd27, #5dff5a);
  box-shadow: 0 4px 12px rgba(43, 221, 39, 0.3);
  color: white;
}

/* Color & Size Controls */
.controls {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: white;
  padding: 16px;
  border-radius: 12px;
  box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
  z-index: 3000;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 200px;
}

.control-label {
  font-size: 11px;
  font-weight: 600;
  color: #636e72;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.color-picker-btn {
  width: 100%;
  height: 50px;
  border: 2px solid #e1e8e5;
  border-radius: 8px;
  cursor: pointer;
  background: #000;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}

.color-picker-btn:hover {
  border-color: #2bdd27;
  transform: scale(1.02);
}

.color-picker-btn::after {
  content: 'Color';
  position: absolute;
  bottom: 4px;
  right: 6px;
  font-size: 10px;
  font-weight: 600;
  color: white;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

input[type="range"] {
  width: 100%;
  height: 6px;
  background: #e1e8e5;
  border-radius: 3px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  background: linear-gradient(135deg, #2bdd27, #5dff5a);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(43, 221, 39, 0.3);
}

input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}

.size-display {
  text-align: center;
  font-size: 14px;
  color: #2bdd27;
  font-weight: 600;
}

/* Action Buttons */
.actions {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  gap: 10px;
  z-index: 3000;
}

.action-btn {
  background: white;
  border: none;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
  transition: all 0.2s ease;
  color: #2d3436;
}

.action-btn:hover {
  box-shadow: 0 4px 20px rgba(43, 221, 39, 0.15);
  transform: translateY(-2px);
}

.action-btn.primary {
  background: linear-gradient(135deg, #2bdd27, #5dff5a);
  color: white;
}

/* Canvas */
.canvas-area {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 100px;
}

#drawing-canvas {
  background: white;
  border-radius: 4px;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
  cursor: crosshair;
}

/* Lasso Selection */
#lasso-overlay {
  position: absolute;
  pointer-events: none;
  z-index: 500;
}

.selection-box {
  position: absolute;
  border: 2px dashed #2bdd27;
  background: rgba(43, 221, 39, 0.1);
  pointer-events: none;
}

.selected-region {
  position: fixed;
  border: 3px dashed #2bdd27;
  background: rgba(43, 221, 39, 0.05);
  box-shadow: 0 4px 20px rgba(43, 221, 39, 0.4);
  cursor: move;
  z-index: 2000;
  animation: marchingAnts 0.5s linear infinite;
}

@keyframes marchingAnts {
  0% { background-position: 0 0; }
  100% { background-position: 8px 8px; }
}

.selected-region:hover {
  box-shadow: 0 6px 30px rgba(43, 221, 39, 0.6);
}

/* Milanote-style Cards */
.board-card {
  position: absolute;
  background: white;
  border-radius: 8px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: grab;
}

.board-card:hover {
  box-shadow: 0 8px 30px rgba(43, 221, 39, 0.15);
  transform: translateY(-2px);
}

.board-card.selected {
  box-shadow: 0 8px 30px rgba(43, 221, 39, 0.25);
  outline: 2px solid #2bdd27;
  outline-offset: 4px;
}

.board-card:active {
  cursor: grabbing;
  transform: scale(1.02);
}

/* Text Card */
.text-card {
  min-width: 240px;
  min-height: 120px;
  padding: 20px;
}

.text-card textarea {
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
  font-size: 15px;
  line-height: 1.6;
  color: #2d3436;
  font-family: inherit;
  resize: none;
  outline: none;
}

.text-card textarea::placeholder {
  color: #b2bec3;
}

/* Image Card */
.image-card {
  padding: 12px;
}

.image-card img {
  display: block;
  max-width: 350px;
  max-height: 350px;
  border-radius: 4px;
  pointer-events: none;
  user-select: none;
}

/* Subtle Card Actions */
.card-menu {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.board-card:hover .card-menu,
.board-card.selected .card-menu {
  opacity: 1;
}

.card-menu-btn {
  min-width: 50px;
  height: 28px;
  padding: 0 10px;
  background: white;
  border: 1px solid #e1e8e5;
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  color: #2d3436;
}

.card-menu-btn:hover {
  background: #f0f9f4;
  border-color: #2bdd27;
  transform: scale(1.1);
}

.card-menu-btn.delete {
  background: #fff5f5;
  border-color: #ffcccb;
  color: #999;
}

.card-menu-btn.delete:hover {
  background: #ffebeb;
  border-color: #ff6b6b;
  color: #ff6b6b;
}

.card-menu-btn.delete.confirm-delete {
  background: #ff4444;
  color: white;
  border-color: #ff4444;
  animation: pulse 0.5s ease;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* Transform Handles - Subtle */
.resize-handle {
  position: absolute;
  width: 10px;
  height: 10px;
  background: #2bdd27;
  border: 2px solid white;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.board-card.selected .resize-handle {
  opacity: 1;
}

.resize-se { bottom: -5px; right: -5px; cursor: nwse-resize; }
.resize-ne { top: -5px; right: -5px; cursor: nesw-resize; }
.resize-sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
.resize-nw { top: -5px; left: -5px; cursor: nwse-resize; }

/* Smooth Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.board-card {
  animation: fadeIn 0.3s ease;
}

/* Hidden inputs */
input[type="color"],
input[type="file"] {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

/* Helper tooltip */
.tooltip {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: #2bdd27;
  color: white;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  box-shadow: 0 4px 20px rgba(43, 221, 39, 0.3);
  z-index: 4000;
  animation: fadeIn 0.3s ease;
}

/* Text Formatting Toolbar */
.text-format-toolbar {
  position: fixed;
  background: white;
  padding: 8px;
  border-radius: 10px;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
  z-index: 3500;
  display: none;
  gap: 6px;
  flex-wrap: wrap;
  max-width: 420px;
}

.text-format-toolbar.visible {
  display: flex;
}

.format-group {
  display: flex;
  gap: 4px;
  padding-right: 8px;
  border-right: 1px solid #e1e8e5;
}

.format-group:last-child {
  border-right: none;
}

.format-btn {
  min-width: 32px;
  height: 32px;
  padding: 0 8px;
  background: transparent;
  border: 1px solid #e1e8e5;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.15s ease;
  color: #2d3436;
}

.format-btn:hover {
  background: #f0f9f4;
  border-color: #2bdd27;
}

.format-btn.active {
  background: #e8f8ec;
  border-color: #2bdd27;
  color: #2bdd27;
}

.format-select {
  height: 32px;
  padding: 0 8px;
  background: white;
  border: 1px solid #e1e8e5;
  border-radius: 6px;
  font-size: 12px;
  color: #2d3436;
  cursor: pointer;
  outline: none;
}

.format-select:hover {
  border-color: #2bdd27;
}

.format-select:focus {
  border-color: #2bdd27;
}
</style>
</head>
<body>

<!-- Minimal Toolbar -->
<div class="toolbar">
  <button class="tool-btn active" onclick="setTool('select')" title="Select (V)" data-tool="select">Select</button>
  <button class="tool-btn" onclick="setTool('brush')" title="Brush (B)" data-tool="brush">Brush</button>
  <button class="tool-btn" onclick="setTool('eraser')" title="Eraser (E)" data-tool="eraser">Eraser</button>
  <button class="tool-btn" onclick="setTool('fill')" title="Fill (F)" data-tool="fill">Fill</button>
  <button class="tool-btn" onclick="setTool('boxLasso')" title="Box Lasso (M)" data-tool="boxLasso">Box Lasso</button>
  <button class="tool-btn" onclick="setTool('freeLasso')" title="Free Lasso (L)" data-tool="freeLasso">Free Lasso</button>
  <div style="width: 1px; height: 30px; background: #e1e8e5; margin: 0 4px;"></div>
  <button class="tool-btn" onclick="addTextCard()" title="Text (T)">Text</button>
  <button class="tool-btn" onclick="triggerImageUpload()" title="Image (I)">Image</button>
</div>

<!-- Actions -->
<div class="actions">
  <button class="action-btn" onclick="undo()" title="Undo (Ctrl+Z)">Undo</button>
  <button class="action-btn" onclick="redo()" title="Redo (Ctrl+Y)">Redo</button>
  <button class="action-btn primary" onclick="exportCanvas()" title="Save">Save</button>
</div>

<!-- Color & Size Controls -->
<div class="controls">
  <div>
    <div class="control-label">Brush Color</div>
    <div class="color-picker-btn" id="colorDisplay" onclick="document.getElementById('colorPicker').click()"></div>
    <input type="color" id="colorPicker" value="#000000" onchange="changeColor(this.value)">
  </div>
  <div>
    <div class="control-label">Brush Size</div>
    <input type="range" id="brushSlider" min="1" max="40" value="5" oninput="changeBrushSize(this.value)">
    <div class="size-display" id="sizeDisplay">5px</div>
  </div>
</div>

<!-- Canvas -->
<div class="canvas-area">
  <canvas id="drawing-canvas" width="1400" height="900"></canvas>
</div>

<!-- Hidden File Input -->
<input type="file" id="imageUpload" accept="image/*" onchange="addImageCard(event)">

<!-- Text Formatting Toolbar -->
<div class="text-format-toolbar" id="textFormatToolbar">
  <div class="format-group">
    <select class="format-select" id="fontFamily" onchange="applyTextFormat('fontFamily', this.value)">
      <option value="Arial">Arial</option>
      <option value="Georgia">Georgia</option>
      <option value="Times New Roman">Times New Roman</option>
      <option value="Courier New">Courier New</option>
      <option value="Verdana">Verdana</option>
      <option value="Comic Sans MS">Comic Sans</option>
    </select>
    <select class="format-select" id="fontSize" onchange="applyTextFormat('fontSize', this.value)">
      <option value="12px">12</option>
      <option value="14px">14</option>
      <option value="16px">16</option>
      <option value="18px" selected>18</option>
      <option value="20px">20</option>
      <option value="24px">24</option>
      <option value="28px">28</option>
      <option value="32px">32</option>
      <option value="36px">36</option>
    </select>
  </div>
  <div class="format-group">
    <button class="format-btn" onclick="applyTextFormat('bold')" title="Bold (Ctrl+B)" id="boldBtn"><b>B</b></button>
    <button class="format-btn" onclick="applyTextFormat('italic')" title="Italic (Ctrl+I)" id="italicBtn"><i>I</i></button>
    <button class="format-btn" onclick="applyTextFormat('underline')" title="Underline" id="underlineBtn"><u>U</u></button>
  </div>
  <div class="format-group">
    <button class="format-btn" onclick="applyTextFormat('left')" title="Align Left">≡</button>
    <button class="format-btn" onclick="applyTextFormat('center')" title="Align Center">≣</button>
    <button class="format-btn" onclick="applyTextFormat('right')" title="Align Right">≡</button>
  </div>
  <div class="format-group">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <input type="color" id="textColorPicker" onchange="applyTextFormat('color', this.value)" title="Text Color" style="position: relative; opacity: 1; pointer-events: all; width: 32px; height: 15px; border: 1px solid #e1e8e5; border-radius: 3px; cursor: pointer;">
      <input type="color" id="bgColorPicker" onchange="applyTextFormat('background', this.value)" title="Background Color" style="position: relative; opacity: 1; pointer-events: all; width: 32px; height: 15px; border: 1px solid #e1e8e5; border-radius: 3px; cursor: pointer;" value="#ffffff">
    </div>
  </div>
</div>

<script>
// ========== STATE ==========
const canvas = document.getElementById('drawing-canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

let currentTool = 'select';
let brushSize = 5;
let currentColor = '#000000';
let isDrawing = false;

let elements = [];
let selectedCard = null;
let activeTextarea = null;
let elementId = 0;

let history = [];
let historyIndex = -1;

// Lasso selection state
let lassoMode = false;
let lassoStart = null;
let lassoBox = null;
let selectedRegion = null;
let selectedImageData = null;
let lassoPath = [];
let freeLassoCanvas = null;

// Initialize
ctx.fillStyle = 'white';
ctx.fillRect(0, 0, canvas.width, canvas.height);
saveHistory();

// ========== SMOOTH TOOL SWITCHING ==========
function setTool(tool) {
  currentTool = tool;
  
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tool === tool);
  });
  
  if (tool === 'select') canvas.style.cursor = 'default';
  else if (tool === 'boxLasso' || tool === 'freeLasso') canvas.style.cursor = 'crosshair';
  else canvas.style.cursor = 'crosshair';
  
  // Deselect when switching tools
  if (tool !== 'select' && selectedCard) {
    deselectCard();
  }
}

function changeBrushSize(size) {
  brushSize = parseInt(size);
  document.getElementById('sizeDisplay').textContent = size + 'px';
}

function changeColor(color) {
  currentColor = color;
  document.getElementById('colorDisplay').style.background = color;
}

// ========== CANVAS DRAWING - SMOOTH ==========
canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDraw);
canvas.addEventListener('mouseleave', stopDraw);

function startDraw(e) {
  if (currentTool === 'select') return;
  
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  
  // Box Lasso selection tool
  if (currentTool === 'boxLasso') {
    startBoxLassoSelection(e, rect);
    return;
  }
  
  // Free Lasso selection tool
  if (currentTool === 'freeLasso') {
    startFreeLassoSelection(e, rect);
    return;
  }
  
  if (currentTool === 'fill') {
    floodFill(Math.floor(x), Math.floor(y));
    saveHistory();
    return;
  }
  
  isDrawing = true;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = brushSize;
  ctx.strokeStyle = currentTool === 'eraser' ? 'white' : currentColor;
}

function draw(e) {
  if (!isDrawing) return;
  
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  
  if (currentTool === 'airbrush') {
    for (let i = 0; i < 8; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * brushSize * 0.5;
      const px = x + Math.cos(angle) * radius;
      const py = y + Math.sin(angle) * radius;
      ctx.fillStyle = currentColor;
      ctx.globalAlpha = 0.3;
      ctx.fillRect(px, py, 2, 2);
      ctx.globalAlpha = 1;
    }
  } else {
    ctx.lineTo(x, y);
    ctx.stroke();
  }
}

function stopDraw() {
  if (isDrawing) {
    isDrawing = false;
    saveHistory();
  }
}

// ========== MILANOTE-STYLE CARDS ==========
function addTextCard() {
  const card = document.createElement('div');
  card.className = 'board-card text-card';
  card.dataset.id = ++elementId;
  
  const x = 200 + Math.random() * 400;
  const y = 150 + Math.random() * 300;
  
  card.style.left = x + 'px';
  card.style.top = y + 'px';
  card.style.zIndex = 100 + elementId;
  
  const textarea = document.createElement('textarea');
  textarea.placeholder = 'Start typing...';
  textarea.addEventListener('mousedown', e => e.stopPropagation());
  textarea.addEventListener('focus', () => {
    selectCard(card);
    activeTextarea = textarea;
    showTextFormatToolbar(card);
  });
  textarea.addEventListener('blur', () => {
    setTimeout(() => {
      if (!document.activeElement.closest('.text-format-toolbar')) {
        hideTextFormatToolbar();
      }
    }, 100);
  });
  
  card.appendChild(textarea);
  addCardMenu(card);
  addResizeHandles(card);
  makeDraggable(card);
  
  document.body.appendChild(card);
  elements.push({ id: elementId, card, type: 'text' });
  
  setTimeout(() => {
    textarea.focus();
    activeTextarea = textarea;
    selectCard(card);
  }, 50);
  showTooltip('Text card added! Use toolbar to format text.');
}

function addImageCard(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = e => {
    const card = document.createElement('div');
    card.className = 'board-card image-card';
    card.dataset.id = ++elementId;
    
    const x = 200 + Math.random() * 400;
    const y = 150 + Math.random() * 300;
    
    card.style.left = x + 'px';
    card.style.top = y + 'px';
    card.style.zIndex = 100 + elementId;
    
    const img = document.createElement('img');
    img.src = e.target.result;
    
    card.appendChild(img);
    addCardMenu(card);
    addResizeHandles(card);
    makeDraggable(card);
    
    document.body.appendChild(card);
    elements.push({ id: elementId, card, type: 'image' });
    
    showTooltip('Image added! Drag to move, use handles to resize.');
  };
  
  reader.readAsDataURL(file);
  event.target.value = '';
}

function triggerImageUpload() {
  document.getElementById('imageUpload').click();
}

// ========== CARD MENU ==========
function addCardMenu(card) {
  const menu = document.createElement('div');
  menu.className = 'card-menu';
  menu.innerHTML = `
    <button class="card-menu-btn" onclick="duplicateCard('${card.dataset.id}')" title="Duplicate (Ctrl+D)">Copy</button>
    <button class="card-menu-btn delete" onclick="confirmDelete('${card.dataset.id}', this)" title="Click twice to delete">Delete</button>
  `;
  card.appendChild(menu);
}

// ========== RESIZE HANDLES ==========
function addResizeHandles(card) {
  const handles = ['nw', 'ne', 'sw', 'se'];
  handles.forEach(pos => {
    const handle = document.createElement('div');
    handle.className = `resize-handle resize-${pos}`;
    handle.addEventListener('mousedown', e => {
      e.stopPropagation();
      startResize(card, pos, e);
    });
    card.appendChild(handle);
  });
}

let resizing = false;
function startResize(card, position, e) {
  resizing = true;
  const startX = e.clientX;
  const startY = e.clientY;
  const startWidth = card.offsetWidth;
  const startHeight = card.offsetHeight;
  const startLeft = parseInt(card.style.left);
  const startTop = parseInt(card.style.top);
  
  function doResize(e) {
    if (!resizing) return;
    
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    
    if (position.includes('e')) card.style.width = Math.max(100, startWidth + dx) + 'px';
    if (position.includes('s')) card.style.height = Math.max(60, startHeight + dy) + 'px';
    if (position.includes('w')) {
      card.style.width = Math.max(100, startWidth - dx) + 'px';
      card.style.left = (startLeft + dx) + 'px';
    }
    if (position.includes('n')) {
      card.style.height = Math.max(60, startHeight - dy) + 'px';
      card.style.top = (startTop + dy) + 'px';
    }
  }
  
  function stopResize() {
    resizing = false;
    document.removeEventListener('mousemove', doResize);
    document.removeEventListener('mouseup', stopResize);
  }
  
  document.addEventListener('mousemove', doResize);
  document.addEventListener('mouseup', stopResize);
}

// ========== SMOOTH DRAGGING ==========
let dragTarget = null;
let dragOffsetX = 0;
let dragOffsetY = 0;

function makeDraggable(card) {
  card.addEventListener('mousedown', e => {
    if (e.target.tagName === 'TEXTAREA') return;
    if (e.target.classList.contains('card-menu-btn')) return;
    if (e.target.classList.contains('resize-handle')) return;
    
    selectCard(card);
    
    if (currentTool !== 'select') return;
    
    dragTarget = card;
    const rect = card.getBoundingClientRect();
    dragOffsetX = e.clientX - rect.left;
    dragOffsetY = e.clientY - rect.top;
    
    e.preventDefault();
  });
}

document.addEventListener('mousemove', e => {
  if (dragTarget && !resizing) {
    dragTarget.style.left = (e.clientX - dragOffsetX) + 'px';
    dragTarget.style.top = (e.clientY - dragOffsetY) + 'px';
  }
});

document.addEventListener('mouseup', () => {
  dragTarget = null;
});

// ========== SELECTION ==========
function selectCard(card) {
  document.querySelectorAll('.board-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  selectedCard = card;
  
  // Show format toolbar if it's a text card
  const textarea = card.querySelector('textarea');
  if (textarea) {
    activeTextarea = textarea;
    showTextFormatToolbar(card);
  }
}

function deselectCard() {
  if (selectedCard) {
    selectedCard.classList.remove('selected');
    selectedCard = null;
    activeTextarea = null;
    hideTextFormatToolbar();
  }
}

canvas.addEventListener('click', () => {
  if (currentTool === 'select') deselectCard();
});

// ========== TEXT FORMATTING TOOLBAR ==========
function showTextFormatToolbar(card) {
  const toolbar = document.getElementById('textFormatToolbar');
  const rect = card.getBoundingClientRect();
  
  // Position above the card
  toolbar.style.left = rect.left + 'px';
  toolbar.style.top = (rect.top - 50) + 'px';
  toolbar.classList.add('visible');
  
  // Update toolbar state based on current styles
  const textarea = card.querySelector('textarea');
  if (textarea) {
    document.getElementById('fontFamily').value = textarea.style.fontFamily || 'Arial';
    document.getElementById('fontSize').value = textarea.style.fontSize || '18px';
    document.getElementById('textColorPicker').value = rgbToHex(textarea.style.color) || '#222222';
    document.getElementById('bgColorPicker').value = rgbToHex(textarea.parentElement.style.background) || '#ffffff';
    
    // Update button states
    document.getElementById('boldBtn').classList.toggle('active', textarea.style.fontWeight === 'bold');
    document.getElementById('italicBtn').classList.toggle('active', textarea.style.fontStyle === 'italic');
    document.getElementById('underlineBtn').classList.toggle('active', textarea.style.textDecoration.includes('underline'));
  }
}

function hideTextFormatToolbar() {
  document.getElementById('textFormatToolbar').classList.remove('visible');
}

function applyTextFormat(property, value) {
  if (!activeTextarea) return;
  
  switch(property) {
    case 'fontFamily':
      activeTextarea.style.fontFamily = value;
      break;
    case 'fontSize':
      activeTextarea.style.fontSize = value;
      break;
    case 'bold':
      const currentWeight = activeTextarea.style.fontWeight;
      activeTextarea.style.fontWeight = currentWeight === 'bold' ? 'normal' : 'bold';
      document.getElementById('boldBtn').classList.toggle('active');
      break;
    case 'italic':
      const currentStyle = activeTextarea.style.fontStyle;
      activeTextarea.style.fontStyle = currentStyle === 'italic' ? 'normal' : 'italic';
      document.getElementById('italicBtn').classList.toggle('active');
      break;
    case 'underline':
      const currentDecor = activeTextarea.style.textDecoration;
      activeTextarea.style.textDecoration = currentDecor.includes('underline') ? 'none' : 'underline';
      document.getElementById('underlineBtn').classList.toggle('active');
      break;
    case 'left':
      activeTextarea.style.textAlign = 'left';
      break;
    case 'center':
      activeTextarea.style.textAlign = 'center';
      break;
    case 'right':
      activeTextarea.style.textAlign = 'right';
      break;
    case 'color':
      activeTextarea.style.color = value;
      break;
    case 'background':
      activeTextarea.parentElement.style.background = value;
      break;
  }
}

// ========== BOX LASSO SELECTION (Rectangular) ==========
function startBoxLassoSelection(e, rect) {
  lassoMode = true;
  lassoStart = {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
  
  if (!lassoBox) {
    lassoBox = document.createElement('div');
    lassoBox.className = 'selection-box';
    lassoBox.style.position = 'absolute';
    canvas.parentElement.appendChild(lassoBox);
  }
  
  lassoBox.style.left = lassoStart.x + 'px';
  lassoBox.style.top = lassoStart.y + 'px';
  lassoBox.style.width = '0px';
  lassoBox.style.height = '0px';
  lassoBox.style.display = 'block';
  
  function drawLasso(e) {
    if (!lassoMode) return;
    
    const currentX = e.clientX - rect.left;
    const currentY = e.clientY - rect.top;
    
    const width = currentX - lassoStart.x;
    const height = currentY - lassoStart.y;
    
    lassoBox.style.left = (width < 0 ? currentX : lassoStart.x) + 'px';
    lassoBox.style.top = (height < 0 ? currentY : lassoStart.y) + 'px';
    lassoBox.style.width = Math.abs(width) + 'px';
    lassoBox.style.height = Math.abs(height) + 'px';
  }
  
  function endLasso(e) {
    lassoMode = false;
    document.removeEventListener('mousemove', drawLasso);
    document.removeEventListener('mouseup', endLasso);
    
    if (lassoBox) {
      const boxRect = lassoBox.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      
      const x = boxRect.left - canvasRect.left;
      const y = boxRect.top - canvasRect.top;
      const w = boxRect.width;
      const h = boxRect.height;
      
      if (w > 5 && h > 5) {
        captureSelection(x, y, w, h);
      }
      
      lassoBox.style.display = 'none';
    }
  }
  
  document.addEventListener('mousemove', drawLasso);
  document.addEventListener('mouseup', endLasso);
}

function captureSelection(x, y, w, h) {
  // Capture the selected region from canvas
  selectedImageData = ctx.getImageData(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
  
  // Clear the selected area (fill with white)
  ctx.fillStyle = 'white';
  ctx.fillRect(x, y, w, h);
  
  // Create movable floating div
  if (selectedRegion) selectedRegion.remove();
  
  const canvasRect = canvas.getBoundingClientRect();
  
  selectedRegion = document.createElement('div');
  selectedRegion.className = 'selected-region';
  selectedRegion.style.position = 'fixed';
  selectedRegion.style.left = (canvasRect.left + x) + 'px';
  selectedRegion.style.top = (canvasRect.top + y) + 'px';
  selectedRegion.style.width = w + 'px';
  selectedRegion.style.height = h + 'px';
  selectedRegion.style.zIndex = '2000';
  
  // Create canvas to show the captured content
  const previewCanvas = document.createElement('canvas');
  previewCanvas.width = w;
  previewCanvas.height = h;
  const previewCtx = previewCanvas.getContext('2d');
  previewCtx.putImageData(selectedImageData, 0, 0);
  previewCanvas.style.width = '100%';
  previewCanvas.style.height = '100%';
  previewCanvas.style.pointerEvents = 'none';
  
  selectedRegion.appendChild(previewCanvas);
  document.body.appendChild(selectedRegion);
  
  makeRegionDraggable(selectedRegion, canvasRect);
  
  showTooltip('✓ Selected! Drag to move, Enter to place, Esc to cancel.');
}

function makeRegionDraggable(region, canvasRect) {
  let isDragging = false;
  let startX = 0;
  let startY = 0;
  let initialLeft = 0;
  let initialTop = 0;
  
  const handleMouseDown = (e) => {
    isDragging = true;
    region.style.cursor = 'grabbing';
    
    startX = e.clientX;
    startY = e.clientY;
    initialLeft = parseInt(region.style.left);
    initialTop = parseInt(region.style.top);
    
    e.stopPropagation();
    e.preventDefault();
  };
  
  const handleMouseMove = (e) => {
    if (!isDragging) return;
    
    const deltaX = e.clientX - startX;
    const deltaY = e.clientY - startY;
    
    region.style.left = (initialLeft + deltaX) + 'px';
    region.style.top = (initialTop + deltaY) + 'px';
  };
  
  const handleMouseUp = () => {
    if (isDragging) {
      isDragging = false;
      region.style.cursor = 'move';
    }
  };
  
  region.addEventListener('mousedown', handleMouseDown);
  document.addEventListener('mousemove', handleMouseMove);
  document.addEventListener('mouseup', handleMouseUp);
  
  // Place selection with Enter key or double-click
  function placeSelection() {
    if (!selectedRegion) return;
    
    const rect = selectedRegion.getBoundingClientRect();
    const finalX = rect.left - canvasRect.left;
    const finalY = rect.top - canvasRect.top;
    
    // Draw the image data back to canvas at new position
    ctx.putImageData(selectedImageData, Math.floor(finalX), Math.floor(finalY));
    saveHistory();
    
    selectedRegion.remove();
    selectedRegion = null;
    selectedImageData = null;
    
    showTooltip('Selection placed!');
    
    // Clean up listeners
    document.removeEventListener('mousemove', handleMouseMove);
    document.removeEventListener('mouseup', handleMouseUp);
    document.removeEventListener('keydown', keyHandler);
  }
  
  // Keyboard controls
  function keyHandler(e) {
    if (e.key === 'Enter') {
      placeSelection();
    } else if (e.key === 'Escape') {
      // Cancel - put it back where it was
      const originalX = parseInt(region.style.left) - canvasRect.left;
      const originalY = parseInt(region.style.top) - canvasRect.top;
      ctx.putImageData(selectedImageData, Math.floor(originalX), Math.floor(originalY));
      
      selectedRegion.remove();
      selectedRegion = null;
      selectedImageData = null;
      
      document.removeEventListener('mousemove', handleMouseMove);
      document.removeEventListener('mouseup', handleMouseUp);
      document.removeEventListener('keydown', keyHandler);
      
      showTooltip('Selection cancelled');
    }
  }
  
  document.addEventListener('keydown', keyHandler);
  
  // Double-click to place
  region.addEventListener('dblclick', placeSelection);
}

// ========== FREE LASSO SELECTION (Draw Custom Shape) ==========
function startFreeLassoSelection(e, rect) {
  lassoMode = true;
  lassoPath = [];
  
  const startX = e.clientX - rect.left;
  const startY = e.clientY - rect.top;
  lassoPath.push({ x: startX, y: startY });
  
  // Create overlay canvas for drawing lasso path
  if (!freeLassoCanvas) {
    freeLassoCanvas = document.createElement('canvas');
    freeLassoCanvas.id = 'lasso-overlay';
    freeLassoCanvas.width = canvas.width;
    freeLassoCanvas.height = canvas.height;
    freeLassoCanvas.style.position = 'absolute';
    freeLassoCanvas.style.left = canvas.offsetLeft + 'px';
    freeLassoCanvas.style.top = canvas.offsetTop + 'px';
    freeLassoCanvas.style.pointerEvents = 'none';
    canvas.parentElement.appendChild(freeLassoCanvas);
  }
  
  const lassoCtx = freeLassoCanvas.getContext('2d');
  lassoCtx.clearRect(0, 0, freeLassoCanvas.width, freeLassoCanvas.height);
  lassoCtx.strokeStyle = '#2bdd27';
  lassoCtx.lineWidth = 2;
  lassoCtx.setLineDash([5, 5]);
  lassoCtx.beginPath();
  lassoCtx.moveTo(startX, startY);
  
  function drawFreeLasso(e) {
    if (!lassoMode) return;
    
    const currentX = e.clientX - rect.left;
    const currentY = e.clientY - rect.top;
    
    lassoPath.push({ x: currentX, y: currentY });
    
    lassoCtx.lineTo(currentX, currentY);
    lassoCtx.stroke();
  }
  
  function endFreeLasso() {
    lassoMode = false;
    document.removeEventListener('mousemove', drawFreeLasso);
    document.removeEventListener('mouseup', endFreeLasso);
    
    if (lassoPath.length > 3) {
      // Close the path
      lassoCtx.closePath();
      lassoCtx.stroke();
      
      // Calculate bounding box
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      lassoPath.forEach(p => {
        minX = Math.min(minX, p.x);
        minY = Math.min(minY, p.y);
        maxX = Math.max(maxX, p.x);
        maxY = Math.max(maxY, p.y);
      });
      
      const width = maxX - minX;
      const height = maxY - minY;
      
      if (width > 5 && height > 5) {
        captureFreeFormSelection(minX, minY, width, height, lassoPath);
      }
    }
    
    // Clear lasso overlay
    lassoCtx.clearRect(0, 0, freeLassoCanvas.width, freeLassoCanvas.height);
    lassoPath = [];
  }
  
  document.addEventListener('mousemove', drawFreeLasso);
  document.addEventListener('mouseup', endFreeLasso);
}

function captureFreeFormSelection(x, y, w, h, path) {
  // Capture the region
  const imageData = ctx.getImageData(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
  const data = imageData.data;
  
  // Create a mask based on the lasso path
  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = w;
  maskCanvas.height = h;
  const maskCtx = maskCanvas.getContext('2d');
  
  // Draw the path as a filled region
  maskCtx.fillStyle = 'black';
  maskCtx.fillRect(0, 0, w, h);
  maskCtx.globalCompositeOperation = 'destination-out';
  
  maskCtx.beginPath();
  maskCtx.moveTo(path[0].x - x, path[0].y - y);
  path.forEach(p => maskCtx.lineTo(p.x - x, p.y - y));
  maskCtx.closePath();
  maskCtx.fill();
  
  maskCtx.globalCompositeOperation = 'source-in';
  maskCtx.putImageData(imageData, 0, 0);
  
  const maskedImageData = maskCtx.getImageData(0, 0, w, h);
  
  // Clear the selected pixels from canvas (make transparent/white)
  const maskData = maskedImageData.data;
  for (let i = 0; i < data.length; i += 4) {
    if (maskData[i + 3] > 0) {
      data[i] = 255;     // R
      data[i + 1] = 255; // G
      data[i + 2] = 255; // B
      data[i + 3] = 255; // A
    }
  }
  ctx.putImageData(imageData, x, y);
  
  selectedImageData = maskedImageData;
  
  // Create movable region
  if (selectedRegion) selectedRegion.remove();
  
  const canvasRect = canvas.getBoundingClientRect();
  
  selectedRegion = document.createElement('div');
  selectedRegion.className = 'selected-region';
  selectedRegion.style.position = 'fixed';
  selectedRegion.style.left = (canvasRect.left + x) + 'px';
  selectedRegion.style.top = (canvasRect.top + y) + 'px';
  selectedRegion.style.width = w + 'px';
  selectedRegion.style.height = h + 'px';
  selectedRegion.style.zIndex = '2000';
  
  const previewCanvas = document.createElement('canvas');
  previewCanvas.width = w;
  previewCanvas.height = h;
  const previewCtx = previewCanvas.getContext('2d');
  previewCtx.putImageData(maskedImageData, 0, 0);
  previewCanvas.style.width = '100%';
  previewCanvas.style.height = '100%';
  previewCanvas.style.pointerEvents = 'none';
  
  selectedRegion.appendChild(previewCanvas);
  document.body.appendChild(selectedRegion);
  
  makeRegionDraggable(selectedRegion, canvasRect);
  
  showTooltip('✓ Freeform selection! Drag to move, Enter to place.');
}

function rgbToHex(rgb) {
  if (!rgb || rgb === '') return '#222222';
  const match = rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
  if (!match) return rgb;
  
  const r = parseInt(match[1]).toString(16).padStart(2, '0');
  const g = parseInt(match[2]).toString(16).padStart(2, '0');
  const b = parseInt(match[3]).toString(16).padStart(2, '0');
  return '#' + r + g + b;
}

// ========== CARD ACTIONS ==========
let deleteConfirmTimeout = null;

window.confirmDelete = function(id, button) {
  // First click - ask for confirmation
  if (!button.classList.contains('confirm-delete')) {
    button.classList.add('confirm-delete');
    button.textContent = 'Sure?';
    
    // Reset after 3 seconds
    deleteConfirmTimeout = setTimeout(() => {
      button.classList.remove('confirm-delete');
      button.textContent = 'Delete';
    }, 3000);
    
    showTooltip('Click "Sure?" again to confirm deletion');
    return;
  }
  
  // Second click - actually delete
  clearTimeout(deleteConfirmTimeout);
  deleteCard(id);
};

window.deleteCard = function(id) {
  const item = elements.find(el => el.card.dataset.id === id);
  if (item) {
    // Store for potential undo
    const deletedCard = item.card.cloneNode(true);
    const deletedPosition = { left: item.card.style.left, top: item.card.style.top };
    
    item.card.remove();
    elements = elements.filter(el => el.card.dataset.id !== id);
    deselectCard();
    hideTextFormatToolbar();
    
    showTooltip('Card deleted. Press Ctrl+Z to undo.');
  }
};

window.duplicateCard = function(id) {
  const item = elements.find(el => el.card.dataset.id === id);
  if (!item) return;
  
  const clone = item.card.cloneNode(true);
  clone.dataset.id = ++elementId;
  
  const left = parseInt(item.card.style.left) + 30;
  const top = parseInt(item.card.style.top) + 30;
  
  clone.style.left = left + 'px';
  clone.style.top = top + 'px';
  clone.style.zIndex = 100 + elementId;
  
  makeDraggable(clone);
  document.body.appendChild(clone);
  elements.push({ id: elementId, card: clone, type: item.type });
  
  showTooltip('Card duplicated!');
};

// ========== FLOOD FILL ==========
function floodFill(x, y) {
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  const w = canvas.width;
  const h = canvas.height;
  
  const idx = (y * w + x) * 4;
  const startR = data[idx];
  const startG = data[idx + 1];
  const startB = data[idx + 2];
  
  const rgb = hexToRgb(currentColor);
  if (startR === rgb.r && startG === rgb.g && startB === rgb.b) return;
  
  const stack = [[x, y]];
  const visited = new Uint8Array(w * h);
  
  while (stack.length) {
    const [px, py] = stack.pop();
    if (px < 0 || px >= w || py < 0 || py >= h) continue;
    
    const i = (py * w + px) * 4;
    if (visited[py * w + px]) continue;
    if (data[i] !== startR || data[i+1] !== startG || data[i+2] !== startB) continue;
    
    visited[py * w + px] = 1;
    data[i] = rgb.r;
    data[i+1] = rgb.g;
    data[i+2] = rgb.b;
    data[i+3] = 255;
    
    stack.push([px+1, py], [px-1, py], [px, py+1], [px, py-1]);
  }
  
  ctx.putImageData(imageData, 0, 0);
}

function hexToRgb(hex) {
  hex = hex.replace('#', '');
  return {
    r: parseInt(hex.substring(0, 2), 16),
    g: parseInt(hex.substring(2, 4), 16),
    b: parseInt(hex.substring(4, 6), 16)
  };
}

// ========== HISTORY ==========
function saveHistory() {
  history = history.slice(0, historyIndex + 1);
  history.push(canvas.toDataURL());
  historyIndex++;
  if (history.length > 30) {
    history.shift();
    historyIndex--;
  }
}

function undo() {
  if (historyIndex > 0) {
    historyIndex--;
    loadHistory(history[historyIndex]);
  }
}

function redo() {
  if (historyIndex < history.length - 1) {
    historyIndex++;
    loadHistory(history[historyIndex]);
  }
}

function loadHistory(dataURL) {
  const img = new Image();
  img.onload = () => ctx.drawImage(img, 0, 0);
  img.src = dataURL;
}

// ========== EXPORT ==========
function exportCanvas() {
  // Create composite of canvas + cards
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = canvas.width;
  tempCanvas.height = canvas.height;
  const tempCtx = tempCanvas.getContext('2d');
  
  // Draw main canvas
  tempCtx.drawImage(canvas, 0, 0);
  
  // Draw cards (simplified)
  const link = document.createElement('a');
  link.download = `vision-board-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  
  showTooltip('Vision board saved!');
}

// ========== TOOLTIPS ==========
function showTooltip(message) {
  const existing = document.querySelector('.tooltip');
  if (existing) existing.remove();
  
  const tooltip = document.createElement('div');
  tooltip.className = 'tooltip';
  tooltip.textContent = message;
  document.body.appendChild(tooltip);
  
  setTimeout(() => tooltip.remove(), 2000);
}

// ========== KEYBOARD SHORTCUTS ==========
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
  else if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
  else if (e.ctrlKey && e.key === 'd') { 
    e.preventDefault(); 
    if (selectedCard) duplicateCard(selectedCard.dataset.id); 
  }
  else if (e.key === 'Delete' && selectedCard) { 
    // Delete key requires confirmation too
    const deleteBtn = selectedCard.querySelector('.delete');
    if (deleteBtn) {
      if (confirm('Are you sure you want to delete this card?')) {
        deleteCard(selectedCard.dataset.id);
      }
    }
  }
  else if (e.key === 'v') setTool('select');
  else if (e.key === 'b') setTool('brush');
  else if (e.key === 'e') setTool('eraser');
  else if (e.key === 'f') setTool('fill');
  else if (e.key === 'm') setTool('boxLasso');
  else if (e.key === 'l') setTool('freeLasso');
  else if (e.key === 't') addTextCard();
  else if (e.key === 'i') triggerImageUpload();
  else if (e.key === 'Escape') {
    deselectCard();
  }
});

// Welcome message
showTooltip('Select tool active - Add text or images to get started!');
